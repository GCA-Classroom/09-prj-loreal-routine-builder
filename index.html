<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L'Oréal | Smart Routine &amp; Product Advisor</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page-wrapper">
      <header class="site-header">
        <img src="img/loreal-logo.png" alt="L'Oréal logo" class="logo" />
        <h1 class="site-title">Smart Routine &amp; Product Advisor</h1>
        <p class="site-subtitle">
          Explore products, save your favorites, and build a routine made for you.
        </p>
      </header>

      <main>
        <section class="product-browser" aria-labelledby="browseHeading">
          <h2 id="browseHeading" class="section-title">Browse Products</h2>

          <div class="search-section">
            <label for="categoryFilter" class="visually-hidden">
              Choose a product category
            </label>
            <select id="categoryFilter">
              <option value="" disabled selected>Choose a Category</option>
              <option value="cleanser">Cleansers</option>
              <option value="moisturizer">Moisturizers &amp; Treatments</option>
              <option value="skincare">Skincare</option>
              <option value="haircare">Haircare</option>
              <option value="makeup">Makeup</option>
              <option value="hair color">Hair Color</option>
              <option value="hair styling">Hair Styling</option>
              <option value="men's grooming">Men's Grooming</option>
              <option value="suncare">Suncare</option>
              <option value="fragrance">Fragrance</option>
            </select>
          </div>

          <p id="selectionStatus" class="selection-status" aria-live="polite"></p>
          <div id="productsContainer" class="products-grid"></div>
        </section>

        <section class="selected-products" aria-labelledby="selectedHeading">
          <div class="selected-header">
            <div>
              <h2 id="selectedHeading">Selected Products</h2>
              <p id="selectedCount">0 products selected</p>
            </div>
            <button id="clearSelections" class="clear-btn" type="button" disabled>
              <i class="fa-solid fa-trash-can" aria-hidden="true"></i>
              Clear All
            </button>
          </div>

          <div id="selectedProductsList"></div>

          <button id="generateRoutine" class="generate-btn" type="button" disabled>
            <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
            Generate Routine
          </button>
        </section>

        <section class="chatbox">
          <h2>Let's Build Your Routine</h2>
          <div id="chatWindow" class="chat-window"></div>

          <form id="chatForm" class="chat-form">
            <label for="userInput" class="visually-hidden">Message</label>
            <input
              id="userInput"
              name="userInput"
              type="text"
              placeholder="Ask me about products or routines…"
              autocomplete="off"
              required
            />
            <button type="submit" id="sendBtn">
              <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
              <span class="visually-hidden">Send</span>
            </button>
          </form>
        </section>
      </main>

      <footer class="site-footer">
        <p>&copy; 2026 L'Oréal. All rights reserved.</p>
        <nav aria-label="Footer navigation">
          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Use</a>
          <a href="#">Contact</a>
        </nav>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
