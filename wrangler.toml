name = "loreal-routine-builder"
main = "worker/index.js"
compatibility_date = "2026-11-23"
workers_dev = true

[vars]
# Add exact website origins here only if the frontend is hosted separately.
ALLOWED_ORIGINS = ""

[previews.vars]
# Same-origin preview requests are allowed by the Worker; add only exact external preview origins if needed.
ALLOWED_ORIGINS = ""

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api", "/api/*"]
